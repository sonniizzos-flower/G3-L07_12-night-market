function makeGame(lesson,island){
  const raw=QUIZZES[lesson]?.[island];if(!raw||raw.length<ROUND_SIZE)return null;
  const key=`${lesson}:${island}`;
  const history=state.history[key]||{last:[],positions:{},round:0};
  const recent=new Set(history.last||[]);
  const candidate=shuffle(raw.map((_,id)=>id).filter(id=>!recent.has(id)));
  const chosen=[];
  // 造句島每輪至少有一道句子重組及一道造句題；題型優先從上一輪未出現的題目選取。
  if(island==='sentences'){
    for(const type of ['order','write']){
      const found=candidate.find(id=>raw[id].type===type&&!chosen.includes(id));
      if(found!==undefined){chosen.push(found);candidate.splice(candidate.indexOf(found),1)}
    }
  }
  // 保留不同輪的造句題型分布。
  const normal=candidate.filter(id=>!(island==='sentences'&&raw[id].type==='write'));
  const extra=candidate.filter(id=>island==='sentences'&&raw[id].type==='write');
  chosen.push(...normal.slice(0,ROUND_SIZE-chosen.length));
  if(chosen.length<ROUND_SIZE)chosen.push(...extra.slice(0,ROUND_SIZE-chosen.length));
  // 題庫不足兩輪完全不重複時，才從上一輪補足六題；目前已開放課次的題庫皆可避免連續重複。
  if(chosen.length<ROUND_SIZE){
    const fallback=shuffle(raw.map((_,id)=>id).filter(id=>!chosen.includes(id)));
    chosen.push(...fallback.slice(0,ROUND_SIZE-chosen.length));
  }
  const ids=shuffle(chosen).slice(0,ROUND_SIZE);
  const positionCounts=[0,0,0,0,0,0];
  const questions=ids.map(id=>{
    const q=raw[id];let orderedChoices=null;
    if(q.type==='choice'){
      const positions=shuffle(q.choices.map((_,i)=>i)).filter(i=>i!==history.positions?.[id]);
      const available=positions.length?positions:shuffle(q.choices.map((_,i)=>i));
      const min=Math.min(...available.map(i=>positionCounts[i]));
      const slot=available.find(i=>positionCounts[i]===min);
      positionCounts[slot]++;
      orderedChoices=shuffle(q.choices.filter(opt=>opt!==q.answer));
      orderedChoices.splice(slot,0,q.answer);
      history.positions??={};history.positions[id]=slot;
    }
    let displayOrder=null;
    if(q.type==='order'){
      const canonical=q.tokens.map((_,i)=>i);
      history.tokenOrders??={};
      const old=history.tokenOrders[id];
      for(let tries=0;tries<30;tries++){
        const attempt=shuffle(canonical);
        if(attempt.some((v,i)=>v!==i)&&(!old||old.some((v,i)=>v!==attempt[i]))){displayOrder=attempt;break}
      }
      if(!displayOrder){displayOrder=canonical.slice().reverse();}
      history.tokenOrders[id]=displayOrder;
    }
    return {...q,questionId:id,orderedChoices,displayOrder};
  });
  history.last=ids;history.round=(history.round||0)+1;
  state.history[key]=history;saveHistory();
  return {questions,index:0,score:0,answered:false,selected:null,order:[],response:'',feedback:null};
}
function startQuiz(lesson){if(!QUIZZES[lesson]?.[state.island]){showNotice(lesson);return}if(state.island==='final'&&!allBasicDone(lesson)){showModal('🔒','最終寶藏尚未開放',`請先完成第 ${lesson} 課的前四島挑戰，才可以開啟本課的最終寶藏。`);return}state.lesson=lesson;state.quiz=makeGame(lesson,state.island);state.screen='quiz';render();focusMain()}
function currentQuestion(){return state.quiz.questions[state.quiz.index]}
function renderQuiz(){let o=islandOf(state.island),g=state.quiz,q=currentQuestion(),total=g.questions.length,idx=g.index+1;let answerHTML='';if(q.type==='choice'){
  answerHTML=`<div class="options">${q.orderedChoices.map((opt,i)=>{let chosen=g.selected===opt;let correct=opt===q.answer;let style=g.answered?(correct?'correct':chosen?'wrong':''):'';return `<button class="choice ${style}" data-action="choice" data-opt="${encodeURIComponent(opt)}" ${g.answered?'disabled':''}><span class="letter">${'ABCDEF'[i]}</span><span>${escapeHTML(opt)}</span>${g.answered&&correct?'<span class="end-ico">✅</span>':g.answered&&chosen?'<span class="end-ico">❌</span>':''}</button>`}).join('')}</div>`;
}else if(q.type==='order'){
  answerHTML=`<div class="sentence-preview" aria-live="polite">${g.order.length?g.order.map(i=>escapeHTML(q.tokens[i])).join(''):'👆 請依序點選下方詞語，組成句子。'}</div><div class="token-row">${q.displayOrder.map(i=>`<button class="token" data-action="token" data-token="${i}" ${g.answered||g.order.includes(i)?'disabled':''}>${escapeHTML(q.tokens[i])}</button>`).join('')}</div><p class="checking-guide">詞語會放進上方句子框內；按「重新排列」可再試一次。</p>`;
}else{
  answerHTML=`<div class="answer-area"><label for="sentenceInput" style="display:block;font-weight:800;margin-bottom:8px">我的句子：</label><textarea class="writing-box" id="sentenceInput" maxlength="120" placeholder="請在這裡輸入自己的短語或句子。" ${g.answered?'disabled':''}>${escapeHTML(g.response)}</textarea><p class="checking-guide">系統僅做字數與關鍵字初步檢查；語意、標點、句型結構仍需教師確認。</p></div>`;
}
app.innerHTML=`<div class="quiz-wrap"><div class="breadcrumbs"><button data-action="home">冒險地圖</button><span>❯</span><button data-action="market">${o.name}</button><span>❯</span><strong>第 ${state.lesson} 課</strong></div><div class="quiz-head"><h1>${o.icon} ${o.name}・第 ${state.lesson} 課</h1><span style="font-weight:950;color:#477c94">⭐ ${g.score} 分</span></div><div class="progress-track" role="progressbar" aria-valuenow="${g.index}" aria-valuemin="0" aria-valuemax="${total}" aria-label="題目完成進度"><div class="progress-fill" style="width:${100*g.index/total}%"></div></div>
 <div class="quiz-card"><div class="question-kicker"><span class="pill">${escapeHTML(q.tag)}　•　第 ${idx} / ${total} 題</span><button class="btn sm" data-action="speak" data-text="question" aria-label="朗讀目前題目">🔊 朗讀題目</button></div>${q.passage?`<div class="passage"><small>📖 閱讀情境短文（自行編寫，非課文原文）</small>${escapeHTML(q.passage)}<div style="margin-top:9px"><button class="btn sm" data-action="speak" data-text="passage">🔊 朗讀短文</button></div></div>`:''}<h2 class="q-title">${escapeHTML(q.prompt)}</h2>${answerHTML}
 ${g.feedback?`<div class="feedback ${g.feedback.ok?'':'bad'}" role="status"><strong>${g.feedback.ok?'🌟 太棒了，答對了！':'💡 一起看看解題提示'}</strong><div class="detail">${escapeHTML(g.feedback.text)}</div></div>`:''}
 <div class="q-actions"><span class="q-tip">${q.type==='choice'?'請選擇一個答案。':q.type==='order'?'把詞語排成完整句子。':'完成自己的造句練習（只檢查形式）。'}</span>${q.type==='order'&&!g.answered?'<button class="btn sm" data-action="undo-order">↺ 重新排列</button>':''}${g.answered?`<button class="btn primary" data-action="next">${idx===total?'查看闖關成績 🏁':'下一題 →'}</button>`:q.type==='order'?'<button class="btn primary" data-action="check-order">檢查句子 ✓</button>':q.type==='write'?'<button class="btn primary" data-action="check-write">檢查句型 ✓</button>':'<span class="q-tip">答題後會立即顯示解析</span>'}</div></div>
 <div style="margin-top:17px;text-align:center"><button class="btn sm" data-action="market">← 返回課次攤位（本次未完成題目不會保存）</button></div></div>`}
function finishAnswer(ok,text){let g=state.quiz;if(g.answered)return;g.answered=true;if(ok)g.score++;g.feedback={ok,text};renderQuiz()}
function pickChoice(value){const g=state.quiz,q=currentQuestion();if(g.answered||q.type!=='choice')return;if(!q.orderedChoices.includes(value))return;g.selected=value;finishAnswer(value===q.answer,q.explain+(value===q.answer?'':` 正確答案是「${q.answer}」。`))}
function placeToken(idx){const g=state.quiz,q=currentQuestion();if(g.answered||q.type!=='order'||g.order.includes(idx)||!Number.isInteger(idx)||idx<0||idx>=q.tokens.length)return;g.order.push(idx);renderQuiz()}
function checkOrder(){const g=state.quiz,q=currentQuestion();if(q.type!=='order'||g.answered)return;if(g.order.length!==q.tokens.length){showModal('🧩','還沒排完喔','請把所有詞語都點選完，再按「檢查句子」。');return}const ok=g.order.every((v,i)=>v===i);finishAnswer(ok,q.explain+(ok?'':' 可以點選下方的「下一題」繼續，或完成本輪後重新挑戰。'))}
function checkWriting(){const g=state.quiz,q=currentQuestion();if(q.type!=='write'||g.answered)return;
  const s=g.response.trim();const crit=q.criteria||{includes:['一會兒','一會兒'],minLength:12};
  const min=crit.minLength||10;const contentLength=s.replace(/\s/g,'').length;
  let reqs=crit.includes||[];
  let requiredCount={};for(const word of reqs)requiredCount[word]=(requiredCount[word]||0)+1;
  const absent=Object.entries(requiredCount).filter(([word,n])=>(s.split(word).length-1)<n).map(([word,n])=>n===1?`「${word}」`:`${n} 次「${word}」`);
  if(contentLength<min||absent.length){let tip=`請至少寫 ${min} 個字`;if(absent.length)tip+=`，並使用 ${absent.join('、')}`;
    showModal('✍️','再補充一點',tip+'。這裡只檢查字數及指定字詞，寫完仍請老師確認是否通順。');return;}
  finishAnswer(true,`已通過字數與關鍵字初步檢查，取得練習參與分。範例：「${q.sample}」${q.explain}`)
}
function nextQuestion(){const g=state.quiz;if(!g||!g.answered)return;
  if(g.index+1<g.questions.length){g.index++;g.answered=false;g.selected=null;g.order=[];g.response='';g.feedback=null;renderQuiz();focusMain();return}
  const threshold=Math.ceil(g.questions.length*.6),passed=g.score>=threshold;
  const old=saved(state.lesson,state.island);
  const best=Math.max(old?.total===ROUND_SIZE?old.best||0:0,g.score);
  state.progress[state.lesson]??={};
  state.progress[state.lesson][state.island]={best,total:g.questions.length,passed:passed||!!old?.passed,updatedAt:new Date().toISOString()};
  saveProgress();
  g.nightCoins=passed?awardNightCoins(state.lesson,state.island):{amount:0,first:false};
  if(passed)playCoinJingle(state.island==='final');
  state.screen='finish';render();focusMain();}
function renderFinish(){const g=state.quiz,o=islandOf(state.island),total=g.questions.length,pass=g.score>=Math.ceil(total*.6),unlocked=allBasicDone(state.lesson);app.innerHTML=`<div class="finish"><div class="finish-art">${pass?'🪙🎉':'🌱'}</div><h1>${pass?'恭喜過關！夜市幣入袋！':'學習能量再累積！'}</h1><div class="finish-score">${g.score} / ${total}</div><p>${o.icon} ${o.name}｜第 ${state.lesson} 課・${LESSONS[state.lesson].title}</p><p>${pass?'已取得本島通關章！可繼續探索其他島，也能重玩練習不同題目。':'6 題答對至少 4 題才能取得通關章與夜市幣，再挑戰一次吧！'}</p>${pass?`<div class="reward" role="status">🪙 ${g.nightCoins.first?'首次過關獎勵':'再次挑戰獎勵'}：+${g.nightCoins.amount} 枚夜市幣<br>你的夜市幣錢包：${coins()} 枚</div>`:''}${unlocked&&o.id!=='final'?'<p style="color:#167d65">🎉 前四島已完成！第五島的終極挑戰已開放。</p>':''}<div class="finish-actions"><button class="btn primary" data-action="retry">🔄 再玩 6 題</button><button class="btn" data-action="market">🏮 回第七課攤位</button><button class="btn yellow" data-action="home">🗺️ 回冒險地圖</button></div></div>`}
function openIsland(id){const o=islandOf(id);if(!o)return;if(id==='final'&&!anyFinalOpen()){showModal('🔒','終極挑戰尚未開放','請先完成第七課的前四座島，解鎖第五島的課次入口。');return}state.island=id;state.screen='market';render();focusMain()}
function showNotice(num){let lesson=LESSONS[num];showModal('🏮',`第 ${num} 課・${lesson?.title||'新課次'} 攤位`,`這個攤位已預留在五座島嶼裡，目前尚未加入本課的題庫。目前可玩第七課〈風的味道〉；其他課會持續加入。`)}
function showModal(emoji,title,message){modalRoot.innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-emoji">${emoji}</div><h2 id="modalTitle">${escapeHTML(title)}</h2><p>${escapeHTML(message)}</p><button class="btn primary" data-action="close-modal">我知道了 ✓</button></div></div>`;modalRoot.querySelector('button')?.focus()}
function closeModal(){modalRoot.innerHTML=''}
function speak(t){if(!('speechSynthesis' in window)){showModal('🔈','目前無法朗讀','這個瀏覽器未提供語音朗讀功能，建議使用最新版 Chrome、Edge 或 Safari。');return}const q=state.quiz?currentQuestion():null;let message=t==='passage'?q?.passage:t==='question'?q?.prompt:`${t}`;if(!message)return;try{window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(message);utter.lang='zh-TW';utter.rate=.82;utter.pitch=1;if(BGM.playing)BGM.master.gain.setTargetAtTime(.055,BGM.ctx.currentTime,.08);utter.onend=utter.onerror=()=>{if(BGM.playing)BGM.master.gain.setTargetAtTime(.22,BGM.ctx.currentTime,.12)};const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='zh-tw')||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(voice)utter.voice=voice;window.speechSynthesis.speak(utter)}catch{showModal('🔈','朗讀失敗','瀏覽器可能未安裝中文語音，請先確認系統語音功能。')}}
function focusMain(){window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true})}

/* 原創夜市小旅行背景音樂：Web Audio 合成音，不需連網下載素材。 */
const BGM={ctx:null,master:null,timer:null,step:0,nextTime:0,playing:false,noise:null};
const MUSIC_NOTES=['E5','G5','A5','G5','E5',null,'D5','E5',
  'C5','E5','G5','E5','A4','C5','D5',null,
  'A4','C5','F5','A5','G5','F5','E5','C5',
  'D5','E5','G5','B5','A5','G5','D5',null,
  'E5','G5','C6','G5','E5','D5','C5',null,
  'C5','E5','A5','B5','C6','B5','A5','G5',
  'A4','C5','F5','G5','A5','F5','E5','C5',
  'D5','G5','B5','A5','G5','E5','D5','C5'];
const MUSIC_CHORDS=[['C4','E4','G4'],['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4'],
  ['C4','E4','G4'],['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4']];
function pitchHz(note){const m=/^([A-G])([#b]?)(\d)$/.exec(note||'');if(!m)return 0;const semi={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,((Number(m[3])+1)*12+semi-69)/12)}
function makeTone(note,time,duration,volume=0.12,type='triangle'){
  if(!BGM.ctx||!note)return;
  const ctx=BGM.ctx,osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(pitchHz(note),time);
  gain.gain.setValueAtTime(0.0001,time);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0002,volume),time+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001,time+duration);
  osc.connect(gain);gain.connect(BGM.master);osc.start(time);osc.stop(time+duration+0.03);
}
function beat(time,which){if(!BGM.ctx)return;const ctx=BGM.ctx,osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(which==='kick'?145:630,time);osc.frequency.exponentialRampToValueAtTime(which==='kick'?58:410,time+.06);g.gain.setValueAtTime(which==='kick'?.09:.012,time);g.gain.exponentialRampToValueAtTime(.0001,time+(which==='kick'?.15:.035));osc.connect(g);g.connect(BGM.master);osc.start(time);osc.stop(time+.17)}
function scheduleMusic(){if(!BGM.playing||!BGM.ctx)return;const ctx=BGM.ctx;
  const beatLength=60/112/2;
  while(BGM.nextTime<ctx.currentTime+.35){
    const step=BGM.step%64,bar=Math.floor(step/8),part=step%8,chord=MUSIC_CHORDS[bar];
    const note=MUSIC_NOTES[step];
    if(note)makeTone(note,BGM.nextTime,beatLength*.83,.155,'triangle');
    if(part===0||part===4){makeTone(chord[0],BGM.nextTime,.39,.105,'sine');beat(BGM.nextTime,'kick')}
    if(part===2||part===6)beat(BGM.nextTime,'tap');
    if(part===0)for(const n of chord)makeTone(n,BGM.nextTime,.98,.018,'sine');
    BGM.step++;BGM.nextTime+=beatLength;
  }
}
function updateMusicButton(){const b=document.getElementById('musicToggle');if(!b)return;b.textContent=BGM.playing?'🔊 關閉音樂':'🎶 開啟音樂';b.setAttribute('aria-pressed',String(BGM.playing));}
async function toggleMusic(){
  if(BGM.playing){BGM.playing=false;clearInterval(BGM.timer);BGM.timer=null;BGM.master?.gain.setTargetAtTime(.0001,BGM.ctx.currentTime,.055);updateMusicButton();return}
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx){showModal('🎶','無法播放背景音樂','這個瀏覽器不支援 Web Audio，請使用最新版 Chrome、Edge 或 Safari。');return}
  try{
    if(!BGM.ctx){BGM.ctx=new AudioCtx();BGM.master=BGM.ctx.createGain();BGM.master.gain.value=.0001;BGM.master.connect(BGM.ctx.destination)}
    await BGM.ctx.resume();
    BGM.step=0;BGM.nextTime=BGM.ctx.currentTime+.07;BGM.playing=true;
    BGM.master.gain.setTargetAtTime(.22,BGM.ctx.currentTime,.15);
    scheduleMusic();BGM.timer=setInterval(scheduleMusic,90);updateMusicButton();
  }catch{showModal('🎶','音樂暫時無法播放','請確認瀏覽器音訊權限，然後再次按下「開啟音樂」。')}
}
function playCoinJingle(finalReward=false){
  if(!BGM.playing||!BGM.ctx)return;
  const t=BGM.ctx.currentTime+.03;
  ['C6','E6','G6',...(finalReward?['C7']:[])].forEach((n,i)=>makeTone(n,t+i*.12,.28,.11,'sine'));
}

function help(){showModal('🎪','第七課五島夜市玩法','五島以第七課〈風的味道〉為主題。前四島可以自由挑戰；每次六題，答對至少四題即過關。首次過關前四島各獲二十枚夜市幣，第五島獲六十枚；再次通過前四島各得五枚，第五島十五枚。每次再玩會優先換不同題目，選項順序也會打亂。音樂需自行按下「開啟音樂」，可以隨時關閉。第八至十二課暫時只有預留攤位。')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case'home':state.screen='map';render();focusMain();break;case'market':state.screen='market';render();focusMain();break;case'help':help();break;case'music-toggle':toggleMusic();break;case'island':openIsland(b.dataset.island);break;case'stall':{const n=Number(b.dataset.lesson);if(LESSONS[n]?.status==='playable')startQuiz(n);else showNotice(n);break;}case'choice':pickChoice(decodeURIComponent(b.dataset.opt));break;case'token':placeToken(Number(b.dataset.token));break;case'undo-order':state.quiz.order=[];renderQuiz();break;case'check-order':checkOrder();break;case'check-write':checkWriting();break;case'next':nextQuestion();break;case'retry':startQuiz(state.lesson);break;case'speak':speak(b.dataset.text);break;case'close-modal':closeModal();break;case'reset':if(confirm('確定清除這個瀏覽器中的所有島嶼闖關紀錄嗎？')){state.progress={};saveProgress();state.history={};saveHistory();state.wallet={total:0,awarded:{}};saveWallet();state.screen='map';render();}break;}});
document.addEventListener('input',e=>{if(e.target.id==='sentenceInput'&&state.quiz)state.quiz.response=e.target.value});
document.querySelector('#brandHome').addEventListener('click',()=>{state.screen='map';render();focusMain()});
document.querySelector('#brandHome').addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();state.screen='map';render();focusMain()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalRoot.innerHTML)closeModal()});
render();
</script>
